<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datepicker UI</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="date-header">
            <div class="date-inputs">
                <input type="text" id="day-input" placeholder="dd" maxlength="2">
                /
                <input type="text" id="month-input" placeholder="mm" maxlength="2">
                /
                <input type="text" id="year-input" placeholder="yyyy" maxlength="4">
            </div>
            <button class="date-icon">
                <img src="./assets/date-svgrepo-com.svg" alt="date">
            </button>
        </div>

        <div class="date-table">
            <div class="month-selector">
                <button><img src="./assets/back.svg" alt="back"></button>
                <p>
                    <span class="month">December</span>
                    <span class="year">2022</span>
                </p>
                <button><img src="./assets/next.svg" alt="next"></button>
            </div>
            <div class="day-selector">
                <table>
                    <tr>
                        <th>S</th>
                        <th>M</th>
                        <th>T</th>
                        <th>W</th>
                        <th>T</th>
                        <th>F</th>
                        <th>S</th>
                    </tr>
                    <tr>
                        <td><button></button></td>
                        <td><button></button></td>
                        <td><button></button></td>
                        <td><button></button></td>
                        <td><button>1</button></td>
                        <td><button>2</button></td>
                        <td><button>3</button></td>
                    </tr>
                    <tr>
                        <td><button>4</button></td>
                        <td><button>5</button></td>
                        <td><button>6</button></td>
                        <td><button>7</button></td>
                        <td><button>8</button></td>
                        <td><button>9</button></td>
                        <td><button>10</button></td>
                    </tr>
                    <tr>
                        <td><button>11</button></td>
                        <td><button>12</button></td>
                        <td><button>13</button></td>
                        <td><button>14</button></td>
                        <td><button>15</button></td>
                        <td><button>16</button></td>
                        <td><button>17</button></td>
                    </tr>
                    <tr>
                        <td><button>18</button></td>
                        <td><button>19</button></td>
                        <td><button>20</button></td>
                        <td><button>21</button></td>
                        <td><button>22</button></td>
                        <td><button>23</button></td>
                        <td><button>24</button></td>
                    </tr>
                    <tr>
                        <td><button>25</button></td>
                        <td><button>26</button></td>
                        <td><button>27</button></td>
                        <td><button>28</button></td>
                        <td><button>29</button></td>
                        <td><button>30</button></td>
                        <td><button>31</button></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
